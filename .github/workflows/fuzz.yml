name: Fuzz Testing

on:
  schedule:
    - cron: '0 4 * * 3'  # Wednesday 4am UTC
  workflow_dispatch:

permissions: {}

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Jazzer Fuzz Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile only)
        run: ./gradlew :freemind:compileTestJava --no-daemon --no-configuration-cache

      - name: Run fuzz tests
        run: |
          ./gradlew :freemind:test --no-daemon --no-configuration-cache \
            --tests "tests.freemind.fuzz.*" \
            -Djazzer.fuzz=true
        timeout-minutes: 30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: |
            **/crash-*
            **/Jacoco-*
            freemind/build/test-results/
          retention-days: 30
