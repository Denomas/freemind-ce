name: Fuzz Testing

on:
  schedule:
    - cron: '0 4 * * 3'  # Wednesday 4am UTC
  workflow_dispatch:

permissions: {}

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Jazzer Fuzz Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile only)
        run: ./gradlew :freemind:compileTestJava --no-daemon --no-configuration-cache

      - name: Run fuzz tests
        run: |
          ./gradlew :freemind:test --no-daemon --no-configuration-cache \
            --tests "tests.freemind.fuzz.*" \
            -Djazzer.fuzz=true
        timeout-minutes: 30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: |
            **/crash-*
            **/Jacoco-*
            freemind/build/test-results/
          retention-days: 30
